<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">Síntese da ureia por Friedrich Wöhler</title>
  <desc id="description">O cianato de amônio, NH₄OCN, transforma-se em ureia, NH₂CONH₂. A molécula de ureia tem um carbono ligado por dupla ligação ao oxigênio e por ligações simples a dois grupos NH₂.</desc>
  <rect width="960" height="360" rx="20" fill="#101322" />
  <text x="480" y="42" fill="#b8c9ff" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">SÍNTESE DA UREIA · FRIEDRICH WÖHLER · 1828</text>

  <rect x="28" y="76" width="310" height="226" rx="16" fill="#191a30" stroke="#748fc7" stroke-opacity=".6" />
  <text x="183" y="126" fill="#edfdf8" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">CIANATO DE AMÔNIO</text>
  <text x="183" y="190" fill="#38d6a0" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="middle">NH₄OCN</text>
  <text x="183" y="246" fill="#b3bfd5" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">composto inorgânico</text>

  <path d="M365 188h92m-18-14 18 14-18 14" fill="none" stroke="#38d6a0" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" />

  <rect x="484" y="76" width="448" height="226" rx="16" fill="#191a30" stroke="#748fc7" stroke-opacity=".6" />
  <text x="708" y="112" fill="#edfdf8" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">UREIA · CO(NH₂)₂</text>

  <line x1="708" y1="184" x2="708" y2="151" stroke="#edfdf8" stroke-width="4" />
  <line x1="718" y1="184" x2="718" y2="151" stroke="#edfdf8" stroke-width="4" />
  <line x1="696" y1="204" x2="644" y2="232" stroke="#edfdf8" stroke-width="4" />
  <line x1="730" y1="204" x2="782" y2="232" stroke="#edfdf8" stroke-width="4" />

  <circle cx="713" cy="198" r="24" fill="#38d6a0" />
  <circle cx="713" cy="139" r="24" fill="#ff6b7a" />
  <circle cx="627" cy="242" r="24" fill="#6ecfff" />
